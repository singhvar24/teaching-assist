<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Check and save</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Noto+Sans+Devanagari:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans','Noto Sans Devanagari',sans-serif;background:#F7F6F2;color:#1F1E1C}
a{color:#1F5F8B}a:hover{color:#174A6C}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F7F6F2">
<div style="padding: 16px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #D6D3CC; background: #FFFFFF">
<a href="Log.dc.html" aria-label="Back" style="min-width: 44px; min-height: 44px; display: flex; align-items: center; color: #1F1E1C">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
</a>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 17px; font-weight: 600">Check before saving</div>
<div style="font-size: 13px; color: #5E5B55">Fields filled from your voice note</div>
</div>
</div>
<div style="flex-grow: 1; padding: 16px 20px; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{fields}}" as="f" hint-placeholder-count="8">
<div style="background: #FFFFFF; border: 1px solid #D6D3CC; border-radius: 10px; padding: 10px 14px; display: flex; align-items: center; gap: 12px">
<div style="width: 96px; font-size: 13px; color: #5E5B55">{{f.label}}</div>
<div style="flex-grow: 1; font-size: 15px">{{f.value}}</div>
<sc-if value="{{f.voice}}" hint-placeholder-val="{{true}}">
<div style="font-size: 11px; color: #174A6C; padding: 2px 8px; border-radius: 999px; background: #E8EFF5">voice</div>
</sc-if>
</div>
</sc-for>
<div style="font-size: 13px; color: #5E5B55; padding: 6px 2px">Tap any field to correct it. Saved on the phone first, synced when online.</div>
</div>
<div style="padding: 12px 20px 20px; background: #FFFFFF; border-top: 1px solid #D6D3CC; display: flex; gap: 10px">
<a href="Log.dc.html" style="flex-grow: 1; min-height: 52px; display: flex; align-items: center; justify-content: center; border: 1px solid #D6D3CC; color: #1F1E1C; border-radius: 12px; font-size: 16px; text-decoration: none">Speak again</a>
<a href="Main.dc.html" style="flex-grow: 2; min-height: 52px; display: flex; align-items: center; justify-content: center; background: #1F5F8B; color: #FFFFFF; border-radius: 12px; font-size: 16px; font-weight: 600; text-decoration: none">Save to diary</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
fields: [
{ label: 'Date', value: 'Sat 26 Sep, P3', voice: false },
{ label: 'Class', value: '7B · Science', voice: false },
{ label: 'Chapter', value: 'Ch 4 · [chapter name]', voice: false },
{ label: 'Topic', value: '[topic 4.2] completed', voice: true },
{ label: 'Method', value: 'Activity with magnets', voice: true },
{ label: 'Homework', value: 'Exercise 3, Q1–5', voice: true },
{ label: 'Class status', value: 'Needs revision (about half)', voice: true },
{ label: 'Remarks', value: 'Revise 4.2 next period', voice: true }
]
};
}
}
</script>
</body>
</html>
